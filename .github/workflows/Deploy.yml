name: Deploy to Production
on:
  workflow_run:
    workflows:
      - "Build Docker Image"
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: harly-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Determine deployment version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHA:0:7}"

          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/keepyjalive/harly:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          echo "Deploying commit: ${SHA}"
          echo "Deploying image: ghcr.io/keepyjalive/harly:sha-${SHORT_SHA}"

      - name: Deploy Harly
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ steps.version.outputs.sha }}
          HARLY_IMAGE: ${{ steps.version.outputs.image }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: DEPLOY_SHA,HARLY_IMAGE
          script_stop: true
          script: |
            set -euo pipefail

            REPO=/opt/keepyjalive/harly/repo
            ENV_FILE=/opt/keepyjalive/harly/config/.env

            echo "=== Deployment ==="
            echo "Commit: $DEPLOY_SHA"
            echo "Image:  $HARLY_IMAGE"

            cd "$REPO"

            echo "=== Updating repository ==="
            git fetch --prune origin

            # Refuse to deploy an image against the wrong source/config.
            git cat-file -e "${DEPLOY_SHA}^{commit}"

            git checkout main
            git reset --hard "$DEPLOY_SHA"

            echo "Repository now at:"
            git rev-parse HEAD

            echo "=== Pulling deployment image ==="
            export HARLY_IMAGE
            docker compose --env-file "$ENV_FILE" pull app migrate scheduler

            echo "=== Running database migrations ==="
            docker compose --env-file "$ENV_FILE" run --rm --no-deps migrate

            echo "=== Starting application ==="
            docker compose --env-file "$ENV_FILE" up -d \
              --no-deps \
              --force-recreate \
              app scheduler

            echo "=== Waiting for application health ==="
            APP_CONTAINER="$(docker compose --env-file "$ENV_FILE" ps -q app)"

            if [ -z "$APP_CONTAINER" ]; then
              echo "App container was not created."
              exit 1
            fi

            for attempt in $(seq 1 30); do
              STATUS="$(docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "$APP_CONTAINER")"

              echo "App health: $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                break
              fi

              if [ "$STATUS" = "unhealthy" ]; then
                echo "Application became unhealthy."
                docker compose --env-file "$ENV_FILE" logs --tail=100 app
                exit 1
              fi

              if [ "$attempt" -eq 30 ]; then
                echo "Timed out waiting for application health."
                docker compose --env-file "$ENV_FILE" logs --tail=100 app
                exit 1
              fi

              sleep 5
            done

            echo "=== Deployment status ==="
            docker compose --env-file "$ENV_FILE" ps

            echo "Deployment completed successfully."
